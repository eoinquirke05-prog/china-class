<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ink Ring</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #f2e9d8;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;

  function draw() {
    var w = window.innerWidth;
    var h = window.innerHeight;

    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Warm rice-paper cream background
    ctx.fillStyle = '#f4ecdb';
    ctx.fillRect(0, 0, w, h);

    // A faint, uneven paper tone so the cream feels warm, not flat
    var paper = ctx.createRadialGradient(
      w / 2, h / 2, Math.min(w, h) * 0.1,
      w / 2, h / 2, Math.max(w, h) * 0.75
    );
    paper.addColorStop(0, 'rgba(255, 250, 238, 0.55)');
    paper.addColorStop(1, 'rgba(226, 214, 190, 0.35)');
    ctx.fillStyle = paper;
    ctx.fillRect(0, 0, w, h);

    var cx = w / 2;
    var cy = h / 2;

    // Keep the ring modest so there is lots of calm empty space around it
    var radius = Math.min(w, h) * 0.22;

    // Pre-compute a wobbly, slightly-irregular outline once so every
    // ink layer traces the same hand-drawn path.
    var steps = 240;
    var seed = 7.13;
    var pts = [];
    for (var i = 0; i <= steps; i++) {
      var a = (i / steps) * Math.PI * 2;
      // Layered sines = organic, non-repeating wobble (no perfect circle)
      var wobble =
        Math.sin(a * 3 + seed) * 0.020 +
        Math.sin(a * 5 - seed * 1.7) * 0.012 +
        Math.sin(a * 8 + seed * 0.4) * 0.007 +
        Math.sin(a * 13 - seed) * 0.004;
      var r = radius * (1 + wobble);
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }

    function tracePath() {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (var j = 1; j < pts.length; j++) {
        ctx.lineTo(pts[j][0], pts[j][1]);
      }
      ctx.closePath();
    }

    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    // Soft ink wash: several translucent strokes, from a wide diffuse
    // halo down to a darker core, so the edge bleeds like a wet brush.
    var layers = [
      { width: radius * 0.42, color: 'rgba(20, 18, 16, 0.05)' },
      { width: radius * 0.30, color: 'rgba(20, 18, 16, 0.07)' },
      { width: radius * 0.20, color: 'rgba(18, 16, 14, 0.10)' },
      { width: radius * 0.12, color: 'rgba(15, 13, 12, 0.16)' },
      { width: radius * 0.07, color: 'rgba(12, 10, 9, 0.26)' },
      { width: radius * 0.035, color: 'rgba(10, 9, 8, 0.42)' },
      { width: radius * 0.018, color: 'rgba(8, 7, 6, 0.62)' }
    ];

    for (var k = 0; k < layers.length; k++) {
      ctx.strokeStyle = layers[k].color;
      ctx.lineWidth = layers[k].width;
      tracePath();
      ctx.stroke();
    }
  }

  draw();
  window.addEventListener('resize', draw);
})();
</script>
</body>
</html>
